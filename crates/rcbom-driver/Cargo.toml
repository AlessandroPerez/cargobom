[package]
name = "rcbom-driver"
description = "RUSTC_WRAPPER that records crypto-relevant MIR facts through rustc_public"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rcbom-facts = { path = "../rcbom-facts" }
roaring = "0.11"
serde_json = "1"

[package.metadata.rust-analyzer]
rustc_private = true

# Standalone: built with the pinned nightly, not part of the stable workspace.
[workspace]

# The e2e and regression runs (scripts/e2e.sh): optimised, with the checks of a debug build
# (overflow, debug assertions), so a run is fast and an arithmetic overflow still panics.
[profile.e2e]
inherits = "release"
debug-assertions = true
overflow-checks = true
incremental = true
