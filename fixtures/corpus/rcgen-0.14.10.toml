# Ground truth for rcgen-0.14.10: Layer 1 crypto packages and Layer 2 operation sites in the
# project's own source, written from source by two independent labellers (agents, blind
# to each other and to any tool output), differences adjudicated by the rules
# (13 October 2026).

# Ground-truth labels: rcgen 0.14.10 (/var/tmp/rcbom-validate/rcgen-0.14.10)
# Library-only package: analysed as its public API, default features ["crypto", "pem", "ring"],
# host x86_64-unknown-linux-gnu, release profile. Features aws_lc_rs, fips and x509-parser are off:
# sites in code gated on them are listed with must = [] and may = [] (R1.5).
# Callers can pass any public SignatureAlgorithm / KeyIdMethod, so every value the public API
# accepts counts as reachable. #[cfg(test)] modules and examples/ are out of scope.

# ---------------------------------------------------------------- Layer 1

[[package]]
name = "getrandom"
version = "0.2.17"
kind = "rng"
why = "OS random number source used by ring SystemRandom"

[[package]]
name = "pem"
version = "4.0.0"
kind = "support"
why = "PEM encoding/decoding of keys and certificates"

[[package]]
name = "ring"
version = "0.17.14"
kind = "algorithm"
why = "crypto backend (feature ring): ECDSA/Ed25519 keygen and signing, RSA signing, SHA-2 digests, SystemRandom"

[[package]]
name = "rustls-pki-types"
version = "1.14.1"
kind = "pki"
why = "shared X.509/PKI types (certificate and private-key DER wrappers, PEM parsing)"

[[package]]
name = "yasna"
version = "0.6.0"
kind = "support"
why = "ASN.1 DER writer/reader used to encode X.509 certificates, CSRs and CRLs"

[[package]]
name = "zeroize"
version = "1.8.2"
kind = "support"
why = "secure zeroing of secrets; enabled through rustls-pki-types (private-key DER wrappers)"

