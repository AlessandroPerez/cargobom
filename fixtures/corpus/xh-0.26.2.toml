# Ground truth for xh-0.26.2: Layer 1 crypto packages and Layer 2 operation sites in the
# project's own source, written from source by two independent labellers (agents, blind
# to each other and to any tool output), differences adjudicated by the rules
# (13 October 2026).

# Ground-truth labels: xh 0.26.2 (/var/tmp/rcbom-validate/xh-0.26.2)
# Build analysed: default features ["online-tests", "rustls", "network-interface"], host
# x86_64-unknown-linux-gnu, release build of bin "xh" (src/main.rs). Feature http-message-signatures
# is off: src/message_signature.rs (mod gated at main.rs:11) is cfg-disabled and its sites carry
# must = [] and may = [] (R1.5). reqwest 0.13.4 builds the rustls ClientConfig internally with the
# aws-lc-rs provider (reqwest features __rustls, __rustls-aws-lc-rs). Run-time certificates (--verify,
# --cert) and TLS version pinning (--ssl) are out of scope. #[cfg(test)] code is out of scope.

