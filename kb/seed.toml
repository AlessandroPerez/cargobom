# A std trait implemented by the crypto type: `self_type` names it, `path` matches the callee.
# argon2 0.5: Algorithm::default() = Argon2id, Params::default() = m 19 MiB, t 2, p 1 (params.rs).
[[fn]]
crate = "argon2"
self_type = "Argon2"
path = "Default::default$"
asset = "Argon2{variant}-{m_cost}-{t_cost}-{p_cost}"
family = "Argon2"
primitive = "kdf"
functions = ["keyderive"]
params = { variant = { value = "id" }, m_cost = { value = "19456" }, t_cost = { value = "2" }, p_cost = { value = "1" } }

# Argon2::new(algorithm, version, params): the variant is argument 0 (Argon2d = 0, Argon2i = 1,
# Argon2id = 2, argon2 0.5 algorithm.rs); the costs are in the Params value, named where it is
# built (`Params::new(m_cost, t_cost, p_cost, output_len)`, below).
[[fn]]
crate = "argon2"
path = "Argon2::new$"
asset = "Argon2{variant}"
family = "Argon2"
primitive = "kdf"
functions = ["keyderive"]
params = { variant = { const_arg = 0, map = { "0" = "d", "1" = "i", "2" = "id" } } }

# argon2 0.5 `Params::new(m_cost, t_cost, p_cost, output_len)`: the costs; the variant is the
# `Argon2` value's, or the `hash_password_customized` call's it is passed to
[[fn]]
crate = "argon2"
path = "Params::new$"
asset = "Argon2{variant}-{m_cost}-{t_cost}-{p_cost}"
family = "Argon2"
primitive = "kdf"
functions = ["keyderive"]
params = { variant = {}, m_cost = { const_arg = 0 }, t_cost = { const_arg = 1 }, p_cost = { const_arg = 2 } }

# argon2 0.5 `Params::default()` (`Params::DEFAULT`, params.rs): m 19456 KiB, t 2, p 1; the
# variant is the `Argon2` value's it is used with
[[fn]]
crate = "argon2"
self_type = "Params"
