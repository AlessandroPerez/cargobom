[[crate]]
package = "password-hash"
versions = ">=0.5, <0.6"
role = "trait"

# Trait and building-block crates of the RustCrypto 0.10 generation: calls go through them,
# their bodies are not walked.
[[crate]]
package = "aead"
versions = ">=0.5, <0.6"
role = "trait"

[[crate]]
package = "crypto-common"
versions = ">=0.1, <0.2"
role = "trait"

[[crate]]
package = "digest"
versions = ">=0.10, <0.11"
role = "trait"

[[crate]]
package = "cipher"
versions = ">=0.4, <0.5"
role = "trait"

[[crate]]
package = "universal-hash"
versions = ">=0.5, <0.6"
role = "trait"

