# --- Uses -------------------------------------------------------------------------------------
# The method called says what the code does with the asset, for assets of the listed
# primitives (all if none): `expand` is a key derivation for HKDF, not for the AES-256-GCM
# whose key length it is given. Methods not listed (`new`, `new_from_slice`,
# `generate_nonce`, ...) set the asset up; they are evidence, not a use. A method listed under
# two uses makes either, and the call does not say which: a stream cipher's `apply_keystream`
# encrypts or decrypts with the same operation.

[[use]]
function = "encrypt"
primitives = ["ae", "block-cipher", "stream-cipher", "pke", "key-wrap"]
methods = ["encrypt", "encrypt_with_rng", "encrypt_in_place", "encrypt_in_place_detached", "seal_in_place_append_tag", "seal_in_place_separate_tag", "encrypt_padded_mut", "encrypt_padded_vec_mut", "apply_keystream", "wrap", "wrap_with_padding"]

[[use]]
function = "decrypt"
primitives = ["ae", "block-cipher", "stream-cipher", "pke", "key-wrap"]
methods = ["decrypt", "decrypt_blinded", "decrypt_with_rng", "decrypt_in_place", "decrypt_in_place_detached", "open_in_place", "open_within", "decrypt_padded_mut", "decrypt_padded_vec_mut", "apply_keystream", "unwrap", "unwrap_with_padding"]

[[use]]
function = "digest"
primitives = ["hash"]
methods = ["digest", "update", "chain_update", "finalize", "finalize_reset", "finalize_xof", "new_with_prefix", "compute", "consume", "hash"]

[[use]]
function = "tag"
primitives = ["mac"]
methods = ["update", "chain_update", "finalize", "finalize_reset", "finalize_xof", "sign", "keyed_hash"]

[[use]]
function = "verify"
primitives = ["signature", "mac", "kdf"]
methods = ["verify", "verify_slice", "verify_truncated_left", "verify_truncated_right", "verify_password", "verify_strict", "verify_digest", "verify_prehash"]

[[use]]
function = "keyderive"
primitives = ["kdf", "key-agree"]
methods = ["expand", "extract", "expand_multi_info", "diffie_hellman", "scrypt", "agree_ephemeral", "agree", "hash_password", "hash_password_customized", "hash_password_into", "pbkdf2", "pbkdf2_array", "pbkdf2_hmac", "pbkdf2_hmac_array", "derive", "derive_key", "finalize", "finalize_xof", "fill"]

# the `signature` crate's traits: Signer, RandomizedSigner, DigestSigner,
# RandomizedDigestSigner, hazmat::PrehashSigner, RandomizedPrehashSigner
[[use]]
function = "sign"
primitives = ["signature"]
methods = ["sign", "try_sign", "sign_with_rng", "try_sign_with_rng", "sign_digest", "try_sign_digest", "sign_digest_with_rng", "try_sign_digest_with_rng", "sign_prehash", "sign_prehash_with_rng"]

[[use]]
function = "keygen"
methods = ["generate", "generate_key", "random_from_rng", "generate_pkcs8"]

# x25519-dalek 2's `EphemeralSecret::random()`, `StaticSecret::random()` (feature getrandom)
[[use]]
function = "keygen"
primitives = ["key-agree"]
methods = ["random"]

# aws-lc-rs `kem`: `EncapsulationKey::encapsulate()`, `DecapsulationKey::decapsulate(ct)`
[[use]]
function = "encapsulate"
primitives = ["kem"]
methods = ["encapsulate"]

[[use]]
function = "decapsulate"
primitives = ["kem"]
methods = ["decapsulate"]

# --- Provenance -------------------------------------------------------------------------------
# Roles: which value argument of an API is key material (method calls count the receiver as
# argument 0). `path` is a regex over the callee's defining path, or over `<Self type>::<method>`
# (`x25519_dalek::x25519::StaticSecret::from`). The analysis follows each such argument's origin
# inside the enclosing function and classifies it with the sources below: hard-coded (a
# constant), parameter (an argument of the enclosing function), one of the source kinds, derived
# (the output of a KDF), computed (returned by a call that takes nothing from here), or unknown.

[[role]]
path = "KeyInit::new(_from_slice)?$"
args = { "0" = "key" }

[[role]]
path = "KeyIvInit::new(_from_slices)?$"
args = { "0" = "key", "1" = "iv" }

[[role]]
path = "Mac::new(_from_slice)?$"
args = { "0" = "key" }

[[role]]
path = "(Aead|AeadInPlace|AeadMut|AeadInOut)::(encrypt|decrypt)(_in_place)?(_detached)?$"
args = { "1" = "nonce" }

[[role]]
path = "UnboundKey::new$"
args = { "1" = "key" }

# aws-lc-rs keys built from an algorithm and bytes (defining paths: `aead::rand_nonce::`,
# `aead::tls::`, `cipher::`, `cmac::`, `key_wrap::KeyEncryptionKey` = `AesKek`); the QUIC
# header-protection key of ring and aws-lc-rs
[[role]]
path = "^aws_lc_rs::(aead::rand_nonce::RandomizedNonceKey|cipher::UnboundCipherKey|cmac::Key|key_wrap::KeyEncryptionKey)::new$"
args = { "1" = "key" }

[[role]]
path = "^aws_lc_rs::aead::tls::(TlsRecordSealingKey|TlsRecordOpeningKey)::new$"
args = { "2" = "key" }

[[role]]
path = "^(ring|aws_lc_rs)::aead::quic::HeaderProtectionKey::new$"
args = { "1" = "key" }

# a pseudorandom key used as is (`Prk::new_less_safe(alg, prk)`); the TLS 1.2 PRF secret
[[role]]
path = "^(ring|aws_lc_rs)::hkdf::Prk::new_less_safe$"
args = { "1" = "key" }

[[role]]
path = "^aws_lc_rs::tls_prf::Secret::new$"
args = { "1" = "key" }

[[role]]
path = "Nonce::assume_unique_for_key$"
args = { "0" = "nonce" }

[[role]]
path = "LessSafeKey::(seal_in_place\\w*|open_in_place|open_within)$"
args = { "1" = "nonce" }

[[role]]
path = "hmac::Key::new$"
args = { "1" = "key" }

[[role]]
path = "pbkdf2_hmac(_array)?$"
args = { "0" = "password", "1" = "salt" }

[[role]]
path = "^pbkdf2::pbkdf2(_array)?$"
args = { "0" = "password", "1" = "salt" }

# ring/aws-lc-rs pbkdf2::derive(algorithm, iterations, salt, secret, out)
[[role]]
path = "pbkdf2::derive$"
args = { "2" = "salt", "3" = "password" }

[[role]]
path = "SaltString::(encode_b64|from_b64|new)$"
args = { "0" = "salt" }

[[role]]
path = "PasswordHasher::hash_password$"
args = { "1" = "password", "2" = "salt" }

[[role]]
path = "Argon2::hash_password_into$"
args = { "1" = "password", "2" = "salt" }

# the secret (pepper) of `Argon2::new_with_secret(secret, algorithm, version, params)`
[[role]]
path = "^argon2::Argon2::new_with_secret$"
args = { "0" = "key" }

[[role]]
path = "^scrypt::scrypt$"
args = { "0" = "password", "1" = "salt" }

[[role]]
path = "Hkdf::<.*>::new$"
args = { "0" = "salt", "1" = "ikm" }

[[role]]
path = "Hkdf::<.*>::extract$"
args = { "0" = "salt", "1" = "ikm" }

[[role]]
path = "Hkdf::<.*>::from_prk$"
args = { "0" = "key" }

# ring/aws-lc-rs hkdf::Salt::new(algorithm, value), Salt::extract(&self, secret)
[[role]]
path = "hkdf::Salt::new$"
args = { "1" = "salt" }

[[role]]
path = "hkdf::Salt::extract$"
args = { "1" = "ikm" }

[[role]]
path = "SigningKey::(from_bytes|try_from|from)$"
args = { "0" = "key" }

[[role]]
path = "(EncodingKey|DecodingKey)::from_(base64_)?secret$"
args = { "0" = "key" }

[[role]]
path = "RsaPrivateKey::new$"
args = { "0" = "rng" }

# `StaticSecret::from([7u8; 32])`, `bytes.into()`
[[role]]
path = "StaticSecret::(from|into)$"
args = { "0" = "key" }

[[role]]
path = "^x25519_dalek::x25519::(StaticSecret|EphemeralSecret|ReusableSecret)::(random_from_rng|new)$"
args = { "0" = "rng" }

# `x25519_dalek::x25519(k, u)`: k is the secret scalar, u the peer's public coordinate
[[role]]
path = "^x25519_dalek::x25519::x25519$"
args = { "0" = "key" }

[[role]]
path = "^ed25519_dalek::signing::SigningKey::generate$"
args = { "0" = "rng" }

[[role]]
path = "^blake3::(keyed_hash|Hasher::new_keyed)$"
args = { "0" = "key" }

[[role]]
path = "^blake3::derive_key$"
args = { "1" = "ikm" }

# Sources: calls whose result is external input, randomness, or a key derivation. `path` is a
# regex over the callee's defining path (or `<Self type>::<method>`), also matched against the
# type of a field-less value (`OsRng`). Standard-library calls that match nothing here are seen
# through (`as_bytes`, `unwrap`, `to_vec`): the origin is that of their receiver.

[[source]]
kind = "environment"
path = "^std::env::(var|var_os|vars|vars_os|args|args_os)$"

[[source]]
kind = "file"
path = "^std::fs::(read|read_to_string)$|^std::io::(Read|BufRead)::read"

[[source]]
kind = "rng"
path = "(^rand::(rngs::thread::)?(thread_rng|rng)$|^rand::random$|RngCore::(fill_bytes|try_fill_bytes|next_u32|next_u64)$|Rng::(gen|random|fill)|^getrandom::|AeadCore::generate_(nonce|key)$|KeyInit::generate_key$|SaltString::generate$|^(ring|aws_lc_rs)::rand::|SecureRandom::fill$|::random_from_rng$|^x25519_dalek::x25519::(StaticSecret|EphemeralSecret|ReusableSecret)::(random|new)$|OsRng)"

# the output of a key derivation (the PRK, the OKM, a shared secret) is derived, whatever went in
[[source]]
kind = "derived"
path = "(^hkdf::Hkdf::(expand|expand_multi_info|extract)$|^hkdf::HkdfExtract::finalize$|^(ring|aws_lc_rs)::hkdf::(Prk::expand|Okm::fill|Salt::extract)$|^(ring|aws_lc_rs)::pbkdf2::derive$|PasswordHasher::hash_password$|::hash_password_into$|::diffie_hellman$|^(ring|aws_lc_rs)::agreement::(ephemeral::)?agree_ephemeral$|^aws_lc_rs::agreement::agree$|^x25519_dalek::x25519::x25519$|^scrypt::scrypt$|^pbkdf2::pbkdf2(_hmac)?(_array)?$|^blake3::derive_key$)"

# Calls whose result carries only some arguments' data (receiver = argument 0).
[[passthrough]]
path = "^anyhow::Context::(context|with_context)$|^eyre::WrapErr::(wrap_err|wrap_err_with)$"
args = [0]

[[passthrough]]
path = "^base64::engine::Engine::(decode|decode_vec|decode_slice|decode_slice_unchecked)$"
args = [1]

# secrecy's wrappers hand out the secret they hold (`key.expose_secret()`, age)
[[passthrough]]
path = "^secrecy::(ExposeSecret::expose_secret|ExposeSecretMut::expose_secret_mut)$"
args = [0]

# generic-array, the key, nonce and block types of RustCrypto's 0.10 generation
# (`Key::<Aes256Gcm>::from_slice(b"..")`): its constructors from slices and iterators, and its
# slice views, are their argument's data. Before the std entry below, whose `clone_from_slice`
# is a method copying into its receiver.
[[passthrough]]
path = "^generic_array::GenericArray::(from_slice|from_mut_slice|clone_from_slice|from_exact_iter|as_slice|as_mut_slice)$"
args = [0]

# std methods that copy data into their receiver: the data is the argument
[[passthrough]]
path = "::(copy_from_slice|clone_from_slice|extend_from_slice|push_str|push|extend|write_all|fill)$"
args = [1]

# `format!("{secret}")`: the formatted values, not the literal pieces
[[passthrough]]
path = "^core::fmt::Arguments::<.*>::new|^core::fmt::Arguments::new"
args = [1, 2, 3]

# Random generators built from a seed: their output is the seed's (`StdRng::seed_from_u64(42)`).
[[seeded]]
kind = "seed"
path = "SeedableRng::(seed_from_u64|from_seed)$"
