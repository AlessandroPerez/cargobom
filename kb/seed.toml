[[role]]
path = "^(ring|aws_lc_rs)::.*EcdsaKeyPair::(from_pkcs8|from_private_key_and_public_key)$"
args = { "1" = "key" }

# `RsaKeyPair` is an alias: the calls name `ring::rsa::keypair::KeyPair`,
