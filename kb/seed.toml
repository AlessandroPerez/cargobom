[[crate]]
package = "md5"
versions = ">=0.7, <0.8"
role = "algorithm"
candidates = ["MD5"]

[[crate]]
package = "blake3"
versions = ">=1, <2"
role = "algorithm"
candidates = ["BLAKE3"]

[[crate]]
package = "pbkdf2"
versions = ">=0.12, <0.13"
role = "algorithm"
candidates = ["PBKDF2"]

[[crate]]
package = "argon2"
versions = ">=0.5, <0.6"
role = "algorithm"
