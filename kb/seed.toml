# sha2 0.10: Sha256 = CoreWrapper<CtVariableCoreWrapper<Sha256VarCore, U32, OidSha256>>; the
# output size (SHA-224 vs SHA-256) is an argument of the wrapper around the core.
[[type]]
crate = "sha2"
name = "Sha256VarCore"
asset = "SHA-{bits}"
family = "SHA-2"
primitive = "hash"
functions = ["digest"]
params = { bits = { parent_arg = 1, typenum = true, scale = 8 } }

# SHA-512 truncated to 224 or 256 bits is SHA-512/224, SHA-512/256 (sha2 lib.rs: Sha512_224 =
# ..<Sha512VarCore, U28, ..>), not SHA-224, SHA-256.
[[type]]
crate = "sha2"
name = "Sha512VarCore"
asset = "SHA-{bits}"
family = "SHA-2"
primitive = "hash"
functions = ["digest"]
params = { bits = { parent_arg = 1, typenum = true, scale = 8, map = { "224" = "512/224", "256" = "512/256", "384" = "384", "512" = "512" } } }

