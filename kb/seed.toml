# The parameters of an Argon2 value are run-time fields. The constructor that built a receiver
# names them (`Argon2::default()`, `Argon2::new(Algorithm::Argon2i, ..)`, [[fn]] entries below);
# without one the asset is the family name, which the registry has no pattern for. Two methods
# do not use the receiver's: `verify_password` hashes with the algorithm and costs of the stored
# hash, `hash_password_customized(pw, alg, version, params, salt)` with its arguments, and with
# `Algorithm::default()` (Argon2id) when `alg` is `None` (argon2 0.5.3 lib.rs:607).
[[type]]
crate = "argon2"
name = "Argon2"
asset = "Argon2"
family = "Argon2"
primitive = "kdf"
functions = ["keyderive"]
own_params = ["verify_password", "hash_password_customized"]
own_defaults = { variant = "id" }

# The password-hash API types. Their parameters are chosen per call: `hash_password` uses the
# crate's defaults ([[fn]] entries below), `hash_password_customized` the caller's, and
# `verify_password` those of the stored hash string, so the type alone is the family name.
[[type]]
crate = "scrypt"
name = "Scrypt"
asset = "scrypt"
family = "scrypt"
primitive = "kdf"
functions = ["keyderive"]
own_params = ["hash_password_customized"]

