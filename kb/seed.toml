[[role]]
path = "^(ring::rsa::keypair|aws_lc_rs::rsa::key)::KeyPair::(from_pkcs8|from_der)$"
args = { "0" = "key" }

# rsa's private keys decoded from PKCS#8 or PKCS#1 (`DecodePrivateKey`, `DecodeRsaPrivateKey`)
[[role]]
path = "RsaPrivateKey::from_(pkcs8|pkcs1)_(pem|der)$"
args = { "0" = "key" }

[[role]]
path = "hmac::Key::new$"
args = { "1" = "key" }

[[role]]
path = "pbkdf2_hmac(_array)?$"
args = { "0" = "password", "1" = "salt" }

[[role]]
path = "^pbkdf2::pbkdf2(_array)?$"
