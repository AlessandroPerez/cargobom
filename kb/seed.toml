# --- Layer 2: types (RustCrypto) -----------------------------------------------------------
# An ADT that is an algorithm. Parameters come from its generic arguments:
#   { arg = N, map = {..} }     arg N is a type whose name maps to a value
#   { arg = N, typenum = true } arg N is a typenum (or const) integer (times `scale`; through
#                               `map` if given)
#   { arg = N, asset = true }   arg N contains another KB type; its asset name (composition)
#   { parent_arg = N, .. }      the same, but on the type that contains the matched one
#   { .., path = [i, j] }       the argument's own argument i, then that one's argument j
# An argument read as a parameter (map, typenum) is part of the name, not a component.
# `functions` are the asset's defaults when no call reveals the use. `[..]` in a name is written
# only when its parameters differ from `defaults`.

# AES-256-GCM is the standard 16-byte tag and 12-byte nonce; AES-256-GCM-128-128 the same
# cipher with a 16-byte nonce (registry: AES[-(128|192|256)][-(GCM|CCM)][-{tagLength}]
# [-{ivLength}], lengths in bits).
[[type]]
crate = "aes_gcm"
name = "AesGcm"
asset = "AES-{key}-GCM[-{tag_bits}-{nonce_bits}]"
family = "AES"
primitive = "ae"
mode = "gcm"
functions = ["encrypt", "decrypt"]
parameter_set = "{key}"
defaults = { tag_bits = "128", nonce_bits = "96" }
params = { key = { arg = 0, map = { Aes128 = "128", Aes192 = "192", Aes256 = "256" } }, nonce_bytes = { arg = 1, typenum = true }, tag_bytes = { arg = 2, typenum = true }, nonce_bits = { arg = 1, typenum = true, scale = 8 }, tag_bits = { arg = 2, typenum = true, scale = 8 } }

# chacha20 0.9: ChaCha20 = StreamCipherCoreWrapper<ChaChaCore<U10>>, XChaCha20 =
# ..<XChaChaCore<U10>>; the typenum counts double rounds (U4 = 8 rounds, U6 = 12, U10 = 20).
# ChaCha8/12 have no registry name; they are named like the others.
[[type]]
crate = "chacha20poly1305"
name = "ChaChaPoly1305"
asset = "{core}{rounds}-Poly1305"
family = "ChaCha20"
primitive = "ae"
functions = ["encrypt", "decrypt"]
params = { core = { arg = 0, path = [0], map = { ChaChaCore = "ChaCha", XChaChaCore = "XChaCha" } }, rounds = { arg = 0, path = [0, 0], typenum = true, scale = 2 }, nonce_bytes = { arg = 1, typenum = true } }

