# rsa 0.9 `pkcs1v15::SigningKey::<D>::new_unprefixed(key)` / `VerifyingKey::new_unprefixed`:
# the D digest of the message, signed raw, without the DigestInfo prefix (signing_key.rs
# `new_unprefixed`): not the standard RSASSA-PKCS1-v1_5 with D, whose signatures it does not
# verify. The registry has no name for it apart from the bare scheme, which raw-digest
# signing (`Pkcs1v15Sign::new_unprefixed()`) also is.
[[fn]]
crate = "rsa"
path = "pkcs1v15::.*(SigningKey|VerifyingKey)::<.*>::new_unprefixed$|pkcs1v15::.*(SigningKey|VerifyingKey)::new_unprefixed$"
asset = "RSA-PKCS1-1.5"
family = "RSASSA-PKCS1"
primitive = "signature"
functions = ["sign", "verify"]
note = "RSASSA-PKCS1-v1_5 of the message's digest without the DigestInfo prefix"

# rsa 0.9: an RSA private key built from its components (`from_components(n, e, d, primes)`,
# `from_p_q(p, q, e)`, `from_primes(primes, e)`, key.rs): key material, its size in `n`
[[fn]]
crate = "rsa"
path = "RsaPrivateKey::(from_components|from_p_q|from_primes)$"
asset = "RSA"
family = "RSA"
primitive = "pke"
material = "private-key"

# ring / aws-lc-rs: an RSA private key decoded from PKCS#8 or DER (`RsaKeyPair::from_pkcs8`):
# key material whose size is in the encoding and whose padding is chosen at each `sign`
# (`RSA-PKCS1-1.5-SHA-256` there)
[[fn]]
crate = ["ring", "aws_lc_rs"]
path = "^rsa::(keypair|key)::KeyPair::(from_pkcs8|from_der)$"
asset = "RSA"
family = "RSA"
primitive = "signature"
functions = ["sign"]
material = "private-key"

# rsa 0.9: Oaep::new::<D>(), Oaep::new_with_label::<D, S>(label): D is the OAEP hash and
# MGF1's. Oaep::new_with_mgf_hash::<D, M>(), new_with_mgf_hash_and_label::<D, M, S>(label):
# MGF1 hashes with M. The registry's RSA-OAEP[-{hashAlgorithm}][-{maskGenAlgorithm}] names the
# mask generation function after the hash; it is written when it is not MGF1 with the OAEP
# hash (`RSA-OAEP-SHA-256-MGF1-SHA-1`, Java's OAEPWithSHA-256AndMGF1Padding), so that the two
# schemes, whose ciphertexts do not decrypt under each other, are two assets. Both hashes are
# components.
[[fn]]
crate = "rsa"
path = "Oaep::new(_with_label)?$"
asset = "RSA-OAEP-{hash}"
family = "RSAES-OAEP"
primitive = "pke"
functions = ["encrypt", "decrypt"]
params = { hash = { arg = 0, asset = true }, mgf_hash = { arg = 0, asset = true } }

[[fn]]
crate = "rsa"
path = "Oaep::new_with_mgf_hash(_and_label)?$"
asset = "RSA-OAEP-{hash}[-MGF1-{mgf_hash}]"
family = "RSAES-OAEP"
primitive = "pke"
functions = ["encrypt", "decrypt"]
defaults = { mgf_hash = "{hash}" }
params = { hash = { arg = 0, asset = true }, mgf_hash = { arg = 1, asset = true } }

# rsa 0.9 signature paddings: Pkcs1v15Sign::new::<D>() (RSASSA-PKCS1-v1_5 with D's DigestInfo
