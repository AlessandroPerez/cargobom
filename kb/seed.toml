# Sources: calls whose result is external input, randomness, or a key derivation. `path` is a
# regex over the callee's defining path (or `<Self type>::<method>`), also matched against the
# type of a field-less value (`OsRng`). Standard-library calls that match nothing here are seen
# through (`as_bytes`, `unwrap`, `to_vec`): the origin is that of their receiver.

[[source]]
kind = "environment"
path = "^std::env::(var|var_os|vars|vars_os|args|args_os)$"

[[source]]
kind = "file"
path = "^std::fs::(read|read_to_string)$|^(std|alloc)::io::(read::)?Read::read|^(std|alloc)::io::(buf_read::)?BufRead::read"

[[source]]
kind = "rng"
path = "(^rand::(rngs::thread::)?(thread_rng|rng)$|^rand::random$|RngCore::(fill_bytes|try_fill_bytes|next_u32|next_u64)$|Rng::(gen|random|fill)|^getrandom::|AeadCore::generate_(nonce|key)$|KeyInit::generate_key$|SaltString::generate$|^(ring|aws_lc_rs)::rand::|SecureRandom::fill$|::random_from_rng$|^x25519_dalek::x25519::(StaticSecret|EphemeralSecret|ReusableSecret)::(random|new)$|OsRng|ThreadRng::default$)"

# the output of a key derivation (the PRK, the OKM, a shared secret) is derived, whatever went in
[[source]]
kind = "derived"
path = "(^hkdf::Hkdf::(expand|expand_multi_info|extract)$|^hkdf::HkdfExtract::finalize$|^(ring|aws_lc_rs)::hkdf::(Prk::expand|Okm::fill|Salt::extract)$|^(ring|aws_lc_rs)::pbkdf2::derive$|PasswordHasher::hash_password(_customized)?$|::hash_password_into(_with_memory)?$|::diffie_hellman$|^(ring|aws_lc_rs)::agreement::(ephemeral::)?agree_ephemeral$|^aws_lc_rs::agreement::agree$|^x25519_dalek::x25519::x25519$|^scrypt::scrypt$|^pbkdf2::pbkdf2(_hmac)?(_array)?$|^blake3::derive_key$|^blake3::Hasher::new_derive_key$)"

# Calls whose result carries only some arguments' data (receiver = argument 0).
[[passthrough]]
path = "^anyhow::Context::(context|with_context)$|^eyre::WrapErr::(wrap_err|wrap_err_with)$"
args = [0]

[[passthrough]]
path = "^base64::engine::Engine::(decode|decode_vec|decode_slice|decode_slice_unchecked)$"
