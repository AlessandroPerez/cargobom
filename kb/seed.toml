# chacha20 0.9's stream ciphers used directly (`ChaCha20::new(key, nonce).apply_keystream(..)`):
# ChaCha20 = StreamCipherCoreWrapper<ChaChaCore<U10>>, the typenum counting double rounds. In
# ChaCha20-Poly1305 the core is a parameter of that entry, not an asset of its own.
[[type]]
crate = "chacha20"
name = "ChaChaCore"
asset = "ChaCha{rounds}"
family = "ChaCha20"
primitive = "stream-cipher"
functions = ["encrypt", "decrypt"]
params = { rounds = { arg = 0, typenum = true, scale = 2 } }

[[type]]
crate = "chacha20"
name = "XChaChaCore"
asset = "XChaCha{rounds}"
family = "ChaCha20"
primitive = "stream-cipher"
functions = ["encrypt", "decrypt"]
params = { rounds = { arg = 0, typenum = true, scale = 2 } }

# A block cipher in a mode: the cipher is a parameter of the mode, and these entries hold for
# AES ciphers only (`required`): `cbc::Encryptor<blowfish::Blowfish>` and
# `ctr::Ctr64BE<blowfish::Blowfish>` are not AES. aes 0.8's encrypt-only and decrypt-only types
# (`Aes128Enc`, `Aes128Dec`, autodetect.rs) are the same cipher as `Aes128`.
[[type]]
crate = "cbc"
name = "Encryptor"
asset = "AES-{key}-CBC"
family = "AES"
primitive = "block-cipher"
mode = "cbc"
functions = ["encrypt"]
parameter_set = "{key}"
params = { key = { arg = 0, map = { Aes128 = "128", Aes128Enc = "128", Aes128Dec = "128", Aes192 = "192", Aes192Enc = "192", Aes192Dec = "192", Aes256 = "256", Aes256Enc = "256", Aes256Dec = "256" }, required = true } }

[[type]]
crate = "cbc"
name = "Decryptor"
asset = "AES-{key}-CBC"
family = "AES"
primitive = "block-cipher"
mode = "cbc"
functions = ["decrypt"]
parameter_set = "{key}"
params = { key = { arg = 0, map = { Aes128 = "128", Aes128Enc = "128", Aes128Dec = "128", Aes192 = "192", Aes192Enc = "192", Aes192Dec = "192", Aes256 = "256", Aes256Enc = "256", Aes256Dec = "256" }, required = true } }

