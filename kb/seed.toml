# --- Layer 2: statics (ring and aws-lc-rs style) --------------------------------------------
# `name` is a regex over the item's own name; {1}, {2} are its groups. `module` restricts the
# item's path inside its crate when the name alone is ambiguous. aws-lc-rs keeps ring's API and
# names, so most entries cover both crates. `asset_by_method`: the name when the call that
# names the descriptor (in its arguments or its receiver's construction) is one of these
# methods. `functions` say what the descriptor can do: a verification algorithm verifies only.

[[static]]
crate = ["ring", "aws_lc_rs"]
name = "^AES_(128|192|256)_GCM$"
asset = "AES-{1}-GCM"
family = "AES"
primitive = "ae"
mode = "gcm"
parameter_set = "{1}"
functions = ["encrypt", "decrypt"]

[[static]]
crate = "aws_lc_rs"
name = "^AES_(128|256)_GCM_SIV$"
asset = "AES-{1}-GCM-SIV"
family = "AES"
primitive = "ae"
parameter_set = "{1}"
functions = ["encrypt", "decrypt"]

[[static]]
