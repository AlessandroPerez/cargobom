# --- Layer 2: functions (non-generic APIs) ---------------------------------------------------
# `path` is a regex over the callee's defining path with the crate prefix removed; with
# `self_type` (a std trait the crypto type implements), over the full callee path.
# `{ const_arg = N }`: value argument N when it is an integer constant (through `map`, `scale`).
# `{ arg_len = N }`: the length of the array behind value argument N (`&mut [0u8; 32]`).
# `{ arg = N, .. }`: generic argument N, as for types. `use`: what the call does when its method
# is not a listed use (`keygen` for a key generator); without it the call sets the asset up.

[[fn]]
crate = "x25519_dalek"
path = "(StaticSecret|EphemeralSecret|ReusableSecret)::diffie_hellman$"
asset = "x25519"
family = "ECDH"
primitive = "key-agree"
functions = ["keyderive"]
curve = "other/Curve25519"

[[fn]]
crate = "scrypt"
path = "^scrypt$"
asset = "scrypt"
family = "scrypt"
primitive = "kdf"
functions = ["keyderive"]
unresolved = "work factor (log_n, r, p) computed at run time"

[[fn]]
crate = "md5"
path = "^compute$"
asset = "MD5"
family = "MD5"
primitive = "hash"
functions = ["digest"]

# `blake3::hash` always returns 256 bits; a `Hasher`'s output length is chosen when it is
# finalized (`finalize` or `finalize_xof`), so the type alone is plain BLAKE3.
[[fn]]
crate = "blake3"
path = "^hash$"
asset = "BLAKE3-256"
family = "BLAKE3"
primitive = "hash"
functions = ["digest"]

# BLAKE3's keyed mode is a MAC and its key-derivation mode a KDF; the registry names BLAKE3 as
# a hash only, so the name stays BLAKE3 with the primitive telling the modes apart.
[[fn]]
crate = "blake3"
path = "^keyed_hash$"
asset = "BLAKE3-256"
family = "BLAKE3"
primitive = "mac"
functions = ["tag"]
note = "keyed mode"

[[fn]]
crate = "blake3"
path = "^Hasher::new_keyed$"
asset = "BLAKE3"
family = "BLAKE3"
primitive = "mac"
functions = ["tag"]
note = "keyed mode"

[[fn]]
crate = "blake3"
path = "^derive_key$"
asset = "BLAKE3-256"
family = "BLAKE3"
primitive = "kdf"
functions = ["keyderive"]
note = "key derivation mode"

[[fn]]
crate = "blake3"
path = "^Hasher::new_derive_key$"
asset = "BLAKE3"
family = "BLAKE3"
primitive = "kdf"
functions = ["keyderive"]
note = "key derivation mode"

[[fn]]
crate = "pbkdf2"
path = "^pbkdf2_hmac$"
asset = "PBKDF2-{hash}-{iterations}-{dk_len}"
family = "PBKDF2"
primitive = "kdf"
functions = ["keyderive"]
params = { hash = { arg = 0, asset = true }, iterations = { const_arg = 2 }, dk_len = { arg_len = 3 } }

# pbkdf2_hmac_array::<D, N>(password, salt, rounds) -> [u8; N]
[[fn]]
crate = "pbkdf2"
path = "^pbkdf2_hmac_array$"
asset = "PBKDF2-{hash}-{iterations}-{dk_len}"
family = "PBKDF2"
primitive = "kdf"
functions = ["keyderive"]
params = { hash = { arg = 0, asset = true }, iterations = { const_arg = 2 }, dk_len = { arg = 1, typenum = true } }

# A std trait implemented by the crypto type: `self_type` names it, `path` matches the callee.
# argon2 0.5: Algorithm::default() = Argon2id, Params::default() = m 19 MiB, t 2, p 1 (params.rs).
[[fn]]
crate = "argon2"
self_type = "Argon2"
path = "Default::default$"
asset = "Argon2id-19456-2-1"
family = "Argon2"
primitive = "kdf"
functions = ["keyderive"]

# Argon2::new(algorithm, version, params): the variant is argument 0 (Argon2d = 0, Argon2i = 1,
# Argon2id = 2, argon2 0.5 algorithm.rs); the costs are in the Params value.
[[fn]]
crate = "argon2"
path = "Argon2::new$"
asset = "Argon2{variant}"
family = "Argon2"
primitive = "kdf"
functions = ["keyderive"]
params = { variant = { const_arg = 0, map = { "0" = "d", "1" = "i", "2" = "id" } } }

# Key generation without a scheme: key material, not an algorithm.
[[fn]]
crate = "rsa"
path = "RsaPrivateKey::new$"
asset = "RSA-{bits}"
family = "RSA"
primitive = "pke"
functions = ["keygen"]
use = "keygen"
material = "private-key"
size = "{bits}"
params = { bits = { const_arg = 1 } }

# rsa 0.9: Oaep::new::<D>(), Oaep::new_with_label::<D, S>(label)
[[fn]]
crate = "rsa"
path = "Oaep::new(_with_label)?$"
asset = "RSA-OAEP-{hash}"
family = "RSAES-OAEP"
primitive = "pke"
functions = ["encrypt", "decrypt"]
params = { hash = { arg = 0, asset = true } }

# A JWT HMAC key: the algorithm (HS256/384/512) is chosen by the header at encode time.
[[fn]]
crate = "jsonwebtoken"
path = "(EncodingKey|DecodingKey)::from_secret$"
asset = "HMAC"
family = "HMAC"
primitive = "mac"
material = "secret-key"
note = "JWT HMAC key; HS256, HS384 or HS512 is chosen by the token header, not here"

# --- Protocols ---------------------------------------------------------------------------------
# A call that configures a protocol stack. Suites and groups are the protocol crate's statics
# reachable from it; versions come from the crate's enabled features.

[[protocol]]
crate = "rustls"
path = "(ClientConfig|ServerConfig)::builder|crypto::(ring|aws_lc_rs)::default_provider$|CryptoProvider::install_default$"
name = "TLS"
type = "tls"
versions = { "1.3" = "", "1.2" = "tls12" }
suites = "^TLS(13)?_[A-Z0-9_]+$"
groups = "^(X25519MLKEM768|SECP256R1MLKEM768|MLKEM768|MLKEM1024|X25519|SECP256R1|SECP384R1|SECP521R1|FFDHE[0-9]+)$"

# --- Uses -------------------------------------------------------------------------------------
# The method called says what the code does with the asset, for assets of the listed
# primitives (all if none): `expand` is a key derivation for HKDF, not for the AES-256-GCM
# whose key length it is given. Methods not listed (`new`, `new_from_slice`,
# `generate_nonce`, ...) set the asset up; they are evidence, not a use. A method listed under
# two uses makes either, and the call does not say which: a stream cipher's `apply_keystream`
# encrypts or decrypts with the same operation.

[[use]]
function = "encrypt"
primitives = ["ae", "block-cipher", "stream-cipher", "pke", "key-wrap"]
methods = ["encrypt", "encrypt_in_place", "encrypt_in_place_detached", "seal_in_place_append_tag", "seal_in_place_separate_tag", "encrypt_padded_mut", "encrypt_padded_vec_mut", "apply_keystream", "wrap", "wrap_with_padding"]

[[use]]
function = "decrypt"
primitives = ["ae", "block-cipher", "stream-cipher", "pke", "key-wrap"]
methods = ["decrypt", "decrypt_blinded", "decrypt_in_place", "decrypt_in_place_detached", "open_in_place", "open_within", "decrypt_padded_mut", "decrypt_padded_vec_mut", "apply_keystream", "unwrap", "unwrap_with_padding"]

[[use]]
function = "digest"
primitives = ["hash"]
methods = ["digest", "update", "chain_update", "finalize", "finalize_reset", "new_with_prefix", "compute", "hash"]

[[use]]
function = "tag"
primitives = ["mac"]
methods = ["update", "chain_update", "finalize", "finalize_reset", "sign", "keyed_hash"]

[[use]]
function = "verify"
primitives = ["signature", "mac", "kdf"]
methods = ["verify", "verify_slice", "verify_truncated_left", "verify_password", "verify_strict"]

[[use]]
function = "keyderive"
primitives = ["kdf", "key-agree"]
methods = ["expand", "extract", "expand_multi_info", "diffie_hellman", "scrypt", "agree_ephemeral", "hash_password", "hash_password_into", "pbkdf2_hmac", "pbkdf2_hmac_array", "derive", "derive_key", "finalize", "fill"]

[[use]]
function = "sign"
primitives = ["signature"]
methods = ["sign", "try_sign", "sign_with_rng"]

[[use]]
function = "keygen"
methods = ["generate", "generate_key", "random_from_rng", "generate_pkcs8"]

# --- Provenance -------------------------------------------------------------------------------
# Roles: which value argument of an API is key material (method calls count the receiver as
# argument 0). `path` is a regex over the callee's defining path, or over `<Self type>::<method>`
# (`x25519_dalek::x25519::StaticSecret::from`). The analysis follows each such argument's origin
# inside the enclosing function and classifies it with the sources below: hard-coded (a
# constant), parameter (an argument of the enclosing function), one of the source kinds, derived
# (the output of a KDF), computed (returned by a call that takes nothing from here), or unknown.

[[role]]
path = "KeyInit::new(_from_slice)?$"
args = { "0" = "key" }

[[role]]
path = "KeyIvInit::new(_from_slices)?$"
args = { "0" = "key", "1" = "iv" }

[[role]]
path = "Mac::new(_from_slice)?$"
args = { "0" = "key" }

[[role]]
path = "(Aead|AeadInPlace|AeadMut|AeadInOut)::(encrypt|decrypt)(_in_place)?(_detached)?$"
args = { "1" = "nonce" }

[[role]]
path = "UnboundKey::new$"
args = { "1" = "key" }

[[role]]
path = "Nonce::assume_unique_for_key$"
args = { "0" = "nonce" }

[[role]]
path = "LessSafeKey::(seal_in_place\\w*|open_in_place|open_within)$"
args = { "1" = "nonce" }

[[role]]
path = "hmac::Key::new$"
args = { "1" = "key" }

[[role]]
path = "pbkdf2_hmac(_array)?$"
args = { "0" = "password", "1" = "salt" }

# ring/aws-lc-rs pbkdf2::derive(algorithm, iterations, salt, secret, out)
[[role]]
path = "pbkdf2::derive$"
args = { "2" = "salt", "3" = "password" }

[[role]]
path = "SaltString::(encode_b64|from_b64|new)$"
args = { "0" = "salt" }

[[role]]
path = "PasswordHasher::hash_password$"
args = { "1" = "password", "2" = "salt" }

[[role]]
path = "Argon2::hash_password_into$"
args = { "1" = "password", "2" = "salt" }

[[role]]
path = "^scrypt::scrypt$"
args = { "0" = "password", "1" = "salt" }

[[role]]
path = "Hkdf::<.*>::new$"
args = { "0" = "salt", "1" = "ikm" }

[[role]]
path = "Hkdf::<.*>::extract$"
args = { "0" = "salt", "1" = "ikm" }

[[role]]
path = "Hkdf::<.*>::from_prk$"
args = { "0" = "key" }

# ring/aws-lc-rs hkdf::Salt::new(algorithm, value), Salt::extract(&self, secret)
[[role]]
path = "hkdf::Salt::new$"
args = { "1" = "salt" }

[[role]]
path = "hkdf::Salt::extract$"
args = { "1" = "ikm" }

[[role]]
path = "SigningKey::(from_bytes|try_from|from)$"
args = { "0" = "key" }

[[role]]
path = "(EncodingKey|DecodingKey)::from_secret$"
args = { "0" = "key" }

[[role]]
path = "RsaPrivateKey::new$"
args = { "0" = "rng" }

# `StaticSecret::from([7u8; 32])`, `bytes.into()`
[[role]]
path = "StaticSecret::(from|into)$"
args = { "0" = "key" }

[[role]]
path = "StaticSecret::random_from_rng$"
args = { "0" = "rng" }

[[role]]
path = "^blake3::(keyed_hash|Hasher::new_keyed)$"
args = { "0" = "key" }

[[role]]
path = "^blake3::derive_key$"
args = { "1" = "ikm" }

# Sources: calls whose result is external input, randomness, or a key derivation. `path` is a
# regex over the callee's defining path (or `<Self type>::<method>`), also matched against the
# type of a field-less value (`OsRng`). Standard-library calls that match nothing here are seen
# through (`as_bytes`, `unwrap`, `to_vec`): the origin is that of their receiver.

[[source]]
kind = "environment"
path = "^std::env::(var|var_os|vars|vars_os|args|args_os)$"

[[source]]
kind = "file"
path = "^std::fs::(read|read_to_string)$|^std::io::(Read|BufRead)::read"

[[source]]
kind = "rng"
path = "(^rand::(rngs::thread::)?(thread_rng|rng)$|^rand::random$|RngCore::(fill_bytes|try_fill_bytes|next_u32|next_u64)$|Rng::(gen|random|fill)|^getrandom::|AeadCore::generate_(nonce|key)$|KeyInit::generate_key$|SaltString::generate$|^(ring|aws_lc_rs)::rand::|SecureRandom::fill$|::random_from_rng$|OsRng)"

# the output of a key derivation (the PRK, the OKM, a shared secret) is derived, whatever went in
[[source]]
kind = "derived"
path = "(^hkdf::Hkdf::(expand|expand_multi_info|extract)$|^hkdf::HkdfExtract::finalize$|^(ring|aws_lc_rs)::hkdf::(Prk::expand|Okm::fill|Salt::extract)$|^(ring|aws_lc_rs)::pbkdf2::derive$|PasswordHasher::hash_password$|::hash_password_into$|::diffie_hellman$|^(ring|aws_lc_rs)::agreement::agree_ephemeral$|^scrypt::scrypt$|^pbkdf2::pbkdf2(_hmac(_array)?)?$|^blake3::derive_key$)"

# Calls whose result carries only some arguments' data (receiver = argument 0).
[[passthrough]]
path = "^anyhow::Context::(context|with_context)$|^eyre::WrapErr::(wrap_err|wrap_err_with)$"
args = [0]

[[passthrough]]
path = "^base64::engine::Engine::(decode|decode_vec|decode_slice|decode_slice_unchecked)$"
args = [1]

# secrecy's wrappers hand out the secret they hold (`key.expose_secret()`, age)
[[passthrough]]
path = "^secrecy::(ExposeSecret::expose_secret|ExposeSecretMut::expose_secret_mut)$"
args = [0]

# generic-array, the key, nonce and block types of RustCrypto's 0.10 generation
# (`Key::<Aes256Gcm>::from_slice(b"..")`): its constructors from slices and iterators, and its
# slice views, are their argument's data. Before the std entry below, whose `clone_from_slice`
# is a method copying into its receiver.
[[passthrough]]
path = "^generic_array::GenericArray::(from_slice|from_mut_slice|clone_from_slice|from_exact_iter|as_slice|as_mut_slice)$"
args = [0]

# std methods that copy data into their receiver: the data is the argument
[[passthrough]]
path = "::(copy_from_slice|clone_from_slice|extend_from_slice|push_str|push|extend|write_all|fill)$"
args = [1]

# `format!("{secret}")`: the formatted values, not the literal pieces
[[passthrough]]
path = "^core::fmt::Arguments::<.*>::new|^core::fmt::Arguments::new"
args = [1, 2, 3]

# Random generators built from a seed: their output is the seed's (`StdRng::seed_from_u64(42)`).
[[seeded]]
kind = "seed"
path = "SeedableRng::(seed_from_u64|from_seed)$"
