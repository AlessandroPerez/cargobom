# rcbom knowledge base, seed subset (enough for the fixtures and the Phase 0 corpus).
#
# Matching is structural. The driver reports the generic arguments of every call and the def
# path of every static; entries here key on (crate, item name) and generic-argument positions,
# never on printed MIR. Asset names follow the CycloneDX Cryptography Registry patterns
# (schema/cryptography-defs.json). Paths are defining paths, crate first, not re-exports:
# `crypto_common::KeyInit::new_from_slice`, `ring::aead::algorithm::AES_256_GCM`.

version = "0.2.0"

# --- Layer 1: crates -----------------------------------------------------------------------
