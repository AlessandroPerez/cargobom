# feature -> backend package; the enabled one is reported on the component
backends = { ring = "ring", aws_lc_rs = "aws-lc-rs" }

[[crate]]
package = "jsonwebtoken"
versions = ">=9, <10"
role = "protocol"
candidates = []

[[crate]]
package = "aws-lc-rs"
versions = ">=1, <2"
role = "algorithm"
