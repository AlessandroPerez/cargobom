[[static]]
crate = "aws_lc_rs"
name = "^DES_EDE_FOR_LEGACY_USE_ONLY$"
module = "^cipher::"
asset = "3DES-112"
family = "3DES"
primitive = "block-cipher"
parameter_set = "112"
functions = ["encrypt", "decrypt"]

[[static]]
crate = "aws_lc_rs"
name = "^DES_EDE3_FOR_LEGACY_USE_ONLY$"
module = "^cipher::"
asset = "3DES-168"
family = "3DES"
primitive = "block-cipher"
parameter_set = "168"
functions = ["encrypt", "decrypt"]

[[static]]
crate = "aws_lc_rs"
name = "^AES_(128|192|256)$"
module = "^cmac::"
asset = "CMAC-AES-{1}"
family = "CMAC"
primitive = "mac"
functions = ["tag"]

# `TDES_FOR_LEGACY_USE_ONLY` is a deprecated alias of `DES_EDE3_FOR_LEGACY_USE_ONLY` (cmac.rs)
[[static]]
crate = "aws_lc_rs"
name = "^(DES_EDE3|TDES)_FOR_LEGACY_USE_ONLY$"
module = "^cmac::"
asset = "CMAC-3DES-168"
family = "CMAC"
primitive = "mac"
functions = ["tag"]

# A key-encryption key (`AesKek::new(&key_wrap::AES_256, kek)`) is AES-256 for key wrapping;
# the method used says which scheme: `wrap`/`unwrap` are KW (RFC 3394), `wrap_with_padding`/
# `unwrap_with_padding` KWP (RFC 5649, `KeyWrapPadded`), registry AES[-(128|192|256)][-(KW|KWP)].
[[static]]
crate = "aws_lc_rs"
name = "^AES_(128|192|256)$"
module = "^key_wrap::"
asset = "AES-{1}"
asset_by_method = { wrap = "AES-{1}-KW", unwrap = "AES-{1}-KW", wrap_with_padding = "AES-{1}-KWP", unwrap_with_padding = "AES-{1}-KWP" }
family = "AES"
primitive = "key-wrap"
parameter_set = "{1}"
functions = ["encrypt", "decrypt"]

