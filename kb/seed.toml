# --- Provenance -------------------------------------------------------------------------------
# Roles: which value argument of an API is key material (method calls count the receiver as
# argument 0). `path` is a regex over the callee's defining path, or over `<Self type>::<method>`
# (`x25519_dalek::x25519::StaticSecret::from`). The analysis follows each such argument's origin
# inside the enclosing function and classifies it with the sources below: hard-coded (a
# constant), parameter (an argument of the enclosing function), one of the source kinds, derived
# (the output of a KDF), computed (returned by a call that takes nothing from here), or unknown.

[[role]]
path = "KeyInit::new(_from_slice)?$"
args = { "0" = "key" }

[[role]]
path = "KeyIvInit::new(_from_slices)?$"
args = { "0" = "key", "1" = "iv" }

[[role]]
path = "Mac::new(_from_slice)?$"
args = { "0" = "key" }

[[role]]
path = "(Aead|AeadInPlace|AeadMut|AeadInOut)::(encrypt|decrypt)(_in_place)?(_detached)?$"
args = { "1" = "nonce" }

[[role]]
path = "UnboundKey::new$"
args = { "1" = "key" }

# aws-lc-rs keys built from an algorithm and bytes (defining paths: `aead::rand_nonce::`,
# `aead::tls::`, `cipher::`, `cmac::`, `key_wrap::KeyEncryptionKey` = `AesKek`); the QUIC
# header-protection key of ring and aws-lc-rs
[[role]]
path = "^aws_lc_rs::(aead::rand_nonce::RandomizedNonceKey|cipher::UnboundCipherKey|cmac::Key|key_wrap::KeyEncryptionKey)::new$"
args = { "1" = "key" }

[[role]]
path = "^aws_lc_rs::aead::tls::(TlsRecordSealingKey|TlsRecordOpeningKey)::new$"
args = { "2" = "key" }

[[role]]
path = "^(ring|aws_lc_rs)::aead::quic::HeaderProtectionKey::new$"
args = { "1" = "key" }

# keys made from HKDF output (`UnboundKey::from(prk.expand(&[info], &AES_256_GCM)?)`, ring's
# and aws-lc-rs's `From<Okm>` impls): the output is the key (a salt for `Salt`)
[[role]]
path = "^(ring|aws_lc_rs)::(aead::(unbound_key::)?UnboundKey|aead::quic::HeaderProtectionKey|cipher::UnboundCipherKey|hmac::Key|hkdf::Prk)::from$"
args = { "0" = "key" }

[[role]]
path = "^(ring|aws_lc_rs)::hkdf::Salt::from$"
args = { "0" = "salt" }

# a pseudorandom key used as is (`Prk::new_less_safe(alg, prk)`); the TLS 1.2 PRF secret
[[role]]
path = "^(ring|aws_lc_rs)::hkdf::Prk::new_less_safe$"
args = { "1" = "key" }

[[role]]
path = "^aws_lc_rs::tls_prf::Secret::new$"
args = { "1" = "key" }

[[role]]
path = "Nonce::assume_unique_for_key$"
args = { "0" = "nonce" }

[[role]]
path = "LessSafeKey::(seal_\\w+|open_\\w+)$"
args = { "1" = "nonce" }

# aead 0.5's STREAM construction: `Encryptor::new(key, nonce)`, `from_aead(aead, nonce)`, the
# nonce being the stream's prefix (aead 0.5.2 stream.rs)
[[role]]
path = "^aead::stream::(Encryptor|Decryptor)::new$"
args = { "0" = "key", "1" = "nonce" }

[[role]]
path = "^aead::stream::(Encryptor|Decryptor)::from_aead$"
args = { "1" = "nonce" }

# a `SealingKey`/`OpeningKey` takes its nonces from the program's `NonceSequence`: ring calls
# `advance()` before each seal or open (ring 0.17 aead.rs `BoundKey`), so the nonces are what
# the program's `advance` returns
[[produces]]
path = "^(ring|aws_lc_rs)::aead::(BoundKey|SealingKey|OpeningKey)::new$"
role = "nonce"
method = "NonceSequence::advance"


# aws-lc-rs TLS record keys: `seal_in_place_append_tag(nonce, aad, in_out)`
[[role]]
path = "^aws_lc_rs::aead::tls::(TlsRecordSealingKey|TlsRecordOpeningKey)::(seal|open)_\\w+$"
args = { "1" = "nonce" }

# aws-lc-rs block-cipher keys: `less_safe_encrypt(in_out, context)`, the context holding the IV
[[role]]
path = "^aws_lc_rs::cipher::.*::less_safe_encrypt$"
args = { "2" = "iv" }

# ring / aws-lc-rs key pairs from a seed or a serialised private key
[[role]]
path = "^(ring|aws_lc_rs)::.*Ed25519KeyPair::(from_seed_unchecked|from_seed_and_public_key|from_pkcs8|from_pkcs8_maybe_unchecked)$"
