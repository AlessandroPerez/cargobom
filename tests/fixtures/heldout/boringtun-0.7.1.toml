# Ground truth for boringtun-0.7.1 (held-out set): Layer 1 crypto packages and Layer 2 operation
# sites in the package's own source, written from source by two independent labellers (agents,
# blind to each other and to any tool output), differences adjudicated by the rules (22 October
# 2026). The labellers agreed on every package and site; they differed only on the keyed BLAKE2s
# MACs (`Blake2sMac<U16>`, `<U24>`, RFC 7693 keyed mode): the registry's BLAKE2 MAC variant is
# `BLAKE2s-<size>-HMAC` (HMAC over BLAKE2s is the HMAC family's `HMAC-BLAKE2s-256`), so they are
# `BLAKE2s-128-HMAC` and `BLAKE2s-192-HMAC`, at sizes the registry does not list (as R10 names
# bcrypt-pbkdf).

# Labels: boringtun 0.7.1 (/var/tmp/rcbom-validate/heldout/boringtun-0.7.1)
# Library-only package (crate-type staticlib, cdylib, rlib): analysed as its public API (R14),
# default features (none), host x86_64-unknown-linux-gnu, release profile.
# Features device, ffi-bindings, jni-bindings and mock-instant are off: src/device/, src/ffi/ and
# src/jni.rs are not compiled; their sites are listed with must = [] and may = [] (R1.5).
# Public entry points: noise::Tunn (new, set_static_private, encapsulate, decapsulate,
# format_handshake_initiation, update_timers, parse_incoming_packet, ...),
# noise::handshake::parse_handshake_anon, noise::rate_limiter::RateLimiter (new, reset_count,
# verify_packet). Every live site below is reached from them.
# Layer 1 = normal (non-dev, non-build) dependencies from `cargo tree -e normal --target
# x86_64-unknown-linux-gnu`, excluding packages reachable only through proc-macros.
# Layer 2 = calls in src/ into crypto libraries. #[cfg(test)] modules and benches/ are out of scope.
# BLAKE2 names (see boringtun-DECISIONS.md B1): HMAC (RFC 2104) over BLAKE2s-256 is
# HMAC-BLAKE2s-256; keyed BLAKE2s (RFC 7693 MAC mode) with a 16- or 24-byte digest length is
# BLAKE2s-128-HMAC / BLAKE2s-192-HMAC.

