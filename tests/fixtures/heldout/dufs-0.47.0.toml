# Ground truth for dufs-0.47.0 (held-out set): Layer 1 crypto packages and Layer 2 operation sites in
# the package's own source, written from source by two independent labellers (agents, blind to
# each other and to any tool output), differences adjudicated by the rules (22 October 2026).
# The labellers agreed on every site; they differed on the kind of chacha20 0.10.2, built only with
# its `rng` feature as rand 0.10's generator (uuid's `fast-rng`): `rng`, as the corpus labels rand_chacha.

# Ground-truth labels: dufs 0.47.0 (/var/tmp/rcbom-validate/heldout/dufs-0.47.0)
# Build analysed: default features ["tls"] (=> tokio-rustls with features ring, tls12, logging;
# rustls features ring, std, tls12, logging), host x86_64-unknown-linux-gnu, release build of the
# single binary "dufs" (src/main.rs), so no `artifacts` field (R13 does not apply).
# Layer 1 = normal dependencies from `cargo tree -e normal --target x86_64-unknown-linux-gnu`,
# packages reachable only through proc-macros excluded. Layer 2 = calls in src/ into crypto
# libraries (R1, R7-R9, R12). #[cfg(test)] modules and tests/ are out of scope.
# Run-time choices: HTTP requests and --auth rules are environment/input, so every handler reached
# by some request counts (R3). TLS runs only with --tls-cert/--tls-key; certificates and keys are
# loaded at run time (out of scope) and the TLS setup is one [[protocol]] entry.
# uuid 1.28.0 is built with v4 + fast-rng: Uuid::new_v4 draws from rand 0.10 ThreadRng
# (ChaCha12, seeded from getrandom 0.4); its rustdoc names the OS RNG (see DECISIONS).

