# Ground truth for rustic_core-0.13.0 (held-out set): Layer 1 crypto packages and Layer 2 operation
# sites in the package's own source, written from source by two independent labellers (agents,
# blind to each other and to any tool output), differences adjudicated by the rules (22 October
# 2026). The labellers agreed on every package and site; they differed only on the name of the
# AES-256-CTR + Poly1305-AES AEAD at src/crypto/aespoly1305.rs:98 and :127 (a: its two components,
# b: none). R2 asks for one name, the outermost scheme, and an empty `must` and `may` is a dead
# site, so as corpus G8 builds the HPKE names it is one name in registry spelling,
# `AES-256-CTR-Poly1305-AES`, in the form of the registry's `AES-256-CTR-HMAC-SHA1`.

# Ground-truth labels: rustic_core 0.13.0 (/var/tmp/rcbom-validate/heldout/rustic_core-0.13.0)
# Library-only package: analysed as its public API (R14: pub items reachable from lib.rs, e.g.
# Repository::{init, open, add_key, check, ...}, Id::{random, random_from_rng}, repofile::KeyFile and
# MasterKey), default features (default = []: cli, clap and merge are off), host
# x86_64-unknown-linux-gnu, release profile. No site lies in feature- or target-gated code.
# Package set from `cargo tree -e normal --target x86_64-unknown-linux-gnu`; Cargo.lock also holds
# dev-dependency packages (rustic_backend, rustic_testing, proptest: sha2 0.10.9, scrypt 0.11.0,
# rand 0.8.7/0.9.5, ...) that are not in the build. #[cfg(test)] modules and doc examples are out of
# scope.
# Repository crypto: AES256-CTR + Poly1305-AES AEAD (aes256ctr_poly1305aes), scrypt for key files,
# SHA-256 ids, rand 0.10 ThreadRng (ChaCha12 core, seeded from the OS) for keys, nonces, salts, ids,
# the chunker polynomial and the random read-data subset. The AEAD has no registry name as a whole;
# its sites carry the constructed name AES-256-CTR-Poly1305-AES (adjudicated, above).

