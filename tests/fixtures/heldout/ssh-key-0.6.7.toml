# Ground truth for ssh-key-0.6.7 (held-out set): Layer 1 crypto packages and Layer 2 operation sites
# in the package's own source, written from source by two independent labellers (agents, blind to
# each other and to any tool output), adjudicated by the rules before any tool run (23 October
# 2026). Build: features crypto,encryption, the Cargo.lock generated on 22 October 2026 (the package
# ships none). The labellers agreed on 54 of 55 packages and on 31 sites; differences:
# - ssh-cipher's kind (a: algorithm, b: protocol): protocol, as the corpus labels make age-core,
#   hpke and digest_auth, crates that select and build algorithms for a protocol (here by SSH
#   cipher name, with OpenSSH's chacha20-poly1305 built from chacha20 and poly1305).
# - the DSA sites (b only, feature dsa off): kept as dead sites (R1.5), as the held-out labels of
#   boringtun and totp-rs list feature-gated code.
# - src/private/rsa.rs:112 `RsaPrivateKey::new` (a: RSA-PKCS1-1.5-SHA-256 and -SHA-512, b:
#   RSA-PKCS1-1.5): R2 names the scheme the key is made for; an ssh-rsa key is RSASSA-PKCS1-v1_5 with
#   the hash chosen per signature, which the registry's `RSA-PKCS1-1.5` names, so that is must and
#   a's hashed names are may.

# Ground-truth labels (labeller b): ssh-key 0.6.7 (/var/tmp/rcbom-validate/heldout/ssh-key-0.6.7)
# Written from source only, blind to the other labeller and to any tool output (22 October 2026).
# Library-only package (R14): the entry points are the public API (pub functions and methods, and the
# public trait impls on public types such as Signer/Verifier for Ed25519Keypair, EcdsaPrivateKey,
# RsaKeypair, EcdsaPublicKey, RsaPublicKey). Every value a caller can pass counts: HashAlg, Cipher,
# EcdsaCurve, Algorithm and Kdf are public enums, key types have public fields, key files are input.
# Build: the Cargo.lock generated on 22 October 2026, features crypto,encryption on top of the defaults
# (ecdsa, rand_core, std; crypto = ed25519, p256, p384, p521, rsa; encryption = bcrypt-pbkdf and
# ssh-cipher aes-cbc, aes-ctr, aes-gcm, chacha20poly1305), host x86_64-unknown-linux-gnu, release profile
# (debug_assertions off). Features dsa, tdes, getrandom and serde are off: the DSA sites are listed with
# must = [] and may = [] (R1.5). #[cfg(test)] modules, tests/ and doc examples are out of scope.
# Calls that dispatch into ssh-key's own Signer/Verifier impls (PrivateKey, KeypairData, KeyData, SshSig,
# the certificate Builder's generic SigningKey) are not sites; the library calls they reach are.
# RNG draws on the caller's `rng: &mut impl CryptoRngCore` are named OS-RNG: ssh_key::rand_core::OsRng
# (rand_core feature getrandom is on through p521) is the only generator the API itself offers; other
# generators a caller may pass have no name in the rules.

