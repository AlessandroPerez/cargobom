# Ground truth for rage-0.12.1: Layer 1 crypto packages and Layer 2 operation sites in the
# project's own source, written from source by two independent labellers (agents, blind
# to each other and to any tool output), differences adjudicated by the rules
# (13 October 2026).

# Ground-truth labels: rage 0.12.1 (/var/tmp/rcbom-validate/rage-0.12.1)
# Build analysed: default features ["ssh"] (=> age features ssh, armor, cli-common, plugin), host
# x86_64-unknown-linux-gnu, release build of the default binaries: rage (src/bin/rage) and rage-keygen
# (src/bin/rage-keygen). rage-mount (src/bin/rage-mount) has required-features = ["mount"] and is not
# built by default: its sites are listed with must = [] and may = []. build.rs and tests are out of scope.
#
# age algorithm sets follow age 0.12.1's own code per recipient/identity type reachable from rage:
#   header MAC: HKDF-SHA-256 + HMAC-SHA-256; payload: HKDF-SHA-256 + ChaCha20-Poly1305 (STREAM)
#   scrypt (passphrase): scrypt + ChaCha20-Poly1305
#   X25519 (age1...): x25519 + HKDF-SHA-256 + ChaCha20-Poly1305
#   ssh-ed25519: SHA-256 tag + x25519 + HKDF-SHA-256 + ChaCha20-Poly1305 (+ SHA-512 seed->X25519 on decrypt)
#   ssh-rsa: SHA-256 tag + RSA-OAEP-SHA-256
#   p256tag (age1tag1...): HPKE DHKEM(P-256, HKDF-SHA256)/HKDF-SHA256/ChaCha20Poly1305 + SHA-256 + HKDF-SHA-256 tag
#   mlkem768p256tag (age1tagpq1...): HPKE MLKEM768-P256/HKDF-SHA256/ChaCha20Poly1305 + SHA-256 + HKDF-SHA-256 tag
#   passphrase-protected identity files: decrypted as an scrypt age file
#   passphrase-protected OpenSSH keys: bcrypt-pbkdf + AES-256-CBC / AES-128/192/256-CTR / AES-256-GCM
#   plugin recipients/identities: crypto runs in the external age-plugin-* process, nothing in-process
# RNG draws inside age (file key, nonce, salts, ephemeral keys) are internal, not listed.

