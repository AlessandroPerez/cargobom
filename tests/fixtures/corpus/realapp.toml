# ---------------------------------------------------------------- Layer 2

[[site]]
file = "src/main.rs"
line = 3
callee = "generate"
function = "keygen"
must = ["x25519"]
may = []
note = "age::x25519::Identity::generate draws a fresh X25519 StaticSecret from OsRng (age 0.11.5 x25519.rs:65); the following to_public() on line 4 is a getter (R1.1), not a site"

[[site]]
file = "src/main.rs"
line = 5
callee = "encode"
function = "tag"
must = ["HMAC-SHA-256"]
may = []
note = "jsonwebtoken::encode with Header::default(), whose alg is HS256 (header.rs:104-107), and EncodingKey::from_secret: HMAC-SHA-256 via ring"

[[protocol]]
file = "src/main.rs"
line = 8
what = "rustls::crypto::ring::default_provider(): rustls ring CryptoProvider with its default cipher suites and key-exchange groups; only its cipher_suites list is read, no ClientConfig/ServerConfig is built and no TLS session can run"
