# Ground truth for realapp: Layer 1 crypto packages and Layer 2 operation sites in the
# project's own source, written from source by two independent labellers (agents, blind
# to each other and to any tool output), differences adjudicated by the rules
# (13 October 2026).

# Ground-truth labels: realapp 0.1.0 (/var/tmp/rcbom-validate/realapp)
# Build analysed: default features, host x86_64-unknown-linux-gnu, release build of bin "realapp".
# Layer 1 = normal (non-dev, non-build) dependencies of the artifact, resolver-accurate features,
# excluding packages reachable only through proc-macros. Layer 2 = calls in src/ into crypto libraries.
# Labelled from source and package metadata only (see DECISIONS.md).

