# `--target x86_64-unknown-linux-musl`: the dependency table and the code of that platform, not
# the host's (needs `rustup target add x86_64-unknown-linux-musl` for the pinned toolchain).
[package]
name = "select-04"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_env = "musl")'.dependencies]
sha3 = "0.10"

[target.'cfg(not(target_env = "musl"))'.dependencies]
md-5 = "0.10"

[dependencies]
sha2 = "0.10"

[build-dependencies]
sha1 = "0.10"

[workspace]
