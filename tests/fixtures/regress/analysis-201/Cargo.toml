# A key handed down eleven levels of functions, six at each level, every one calling every one of
# the next: 6^11 ways from the key written in `main` to the HMAC that uses it. What a parameter
# is given was asked of each caller of its function, and of each caller of that one, along every
# way up, with no answer kept: 362 million times here, and in justssh 0.4.0 (fifteenth batch),
# where the values on the way are large, an analysis that had not ended after ninety minutes.
# The answer for a function's argument and the fields read of it is the same on every way, and
# is given once: the key is the one in `main`, hard-coded.
[package]
name = "analysis-201"
version = "0.1.0"
edition = "2024"

[dependencies]
hmac = "0.12"
sha2 = "0.10"

[workspace]
