# A call on a trait object of a crypto trait runs one of the types the build makes such an
# object of: each the knowledge base names is a member of the call's set, cited with its
# coercion (miniserve's upload checksum, a `Box<dyn DynDigest>` of SHA-256 or SHA-512, was an
# unknown hash). And a closure called through a `dyn Fn` object gets the arguments of the calls
# made through the object.
[package]
name = "analysis-187"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
ring = "0.17"
sha2 = "0.10"

[workspace]
