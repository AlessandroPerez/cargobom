[package]
name = "t1"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
argon2 = "0.5"
scrypt = { version = "0.11", default-features = false }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rsa = "0.9"
rand = "0.8"
