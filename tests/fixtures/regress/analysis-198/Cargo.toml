# Two versions of one crypto package the knowledge base does not model, each called: the
# unknown algorithm of their operations was named by its providing packages, one name for each
# version (`crypto:algorithm:unknown:unknown:bitcoin_hashes+bitcoin_hashes`), and the verifier
# took the joined names for one package's, which no package of the build has: the operations
# the boundary check cites were rejected (lightning-invoice and nostr under mostro-cli 0.17.1,
# with bitcoin_hashes 0.14 and 1.2, secp256k1 0.29 and 0.30). A package is named once, and the
# verifier reads each of the names joined.
[package]
name = "analysis-198"
version = "0.1.0"
edition = "2024"

[dependencies]
older = { package = "bitcoin_hashes", version = "0.14" }
newer = { package = "bitcoin_hashes", version = "1" }
