# A serializer that hashes what it is given (ic-transport-types 0.49.3's request id, in
# ic_object_store 1.4.4), run by a `#[derive(Serialize)]`. serde's derive gives the call that
# serializes a field the span of the field whole, and a field starts at its documentation comment:
# the compiler has that call, which instantiates the hashing `serialize_field`, at the `///` line.
# The verifier found no code on that line and called the step a mismatch. A documentation comment
# is a token of the item it is on (an attribute); the step may be there where a procedural macro
# writes the caller, and nowhere else. `pm::Tagged` puts a hash call itself at such a span: that
# occurrence is cited at the derive.
[package]
name = "verify-59"
version = "0.1.0"
edition = "2024"

[dependencies]
pm = { path = "pm" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[workspace]
