# More shapes of source the verifier met on crates.io packages it had never read (dryoc, ml-dsa,
# pueue-lib, russh's enum_dispatch, ed25519-zebra, oha): each case is commented where it is.
[package]
name = "verify-48"
version = "0.1.0"
edition = "2024"

[dependencies]
curve25519-dalek = { version = "4", features = ["digest"] }
enum_dispatch = "0.3"
sha2 = "0.10"

