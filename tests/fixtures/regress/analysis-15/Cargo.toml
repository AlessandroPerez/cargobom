[package]
name = "a15"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
blake3 = "1"
cbc = { version = "0.1", features = ["alloc"] }
chacha20 = "0.9"
ctr = "0.9"
ed25519-dalek = { version = "2", features = ["hazmat", "rand_core"] }
hmac = "0.12"
rand = "0.8"
rsa = "0.9"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
