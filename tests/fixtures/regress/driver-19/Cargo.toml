[package]
name = "t19"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1"
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = { version = "0.10", features = ["reduced-round"] }
chacha20 = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
sha1 = "0.10"
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
argon2 = "0.5"
scrypt = "0.11"
ed25519-dalek = { version = "2", features = ["rand_core", "hazmat", "digest"] }
x25519-dalek = { version = "2", features = ["static_secrets", "reusable_secrets", "getrandom"] }
rsa = "0.9"
rand = "0.8"
blake3 = "1"
md5 = "0.7"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
