# A copy of md5 0.7.0 (https://github.com/stainless-steel/md5, Apache-2.0/MIT, see LICENSE.txt),
# served to this probe in place of the registry's (`.cargo/config.toml`). `src/lib.rs` is the
# crate's, with the items after "added for the probe" at its end: statics and a constant
# holding the crate's own functions, as a crate exporting a table of its functions would.
[package]
name = "md5"
version = "0.7.0"
description = "The package provides the MD5 hash function."
license = "Apache-2.0/MIT"
repository = "https://github.com/stainless-steel/md5"

[features]
default = ["std"]
std = []
