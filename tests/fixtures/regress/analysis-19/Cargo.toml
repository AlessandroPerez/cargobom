[package]
name = "a19"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

# Only the tests use ring: a normal build never compiles it (not declared-not-used, not a
# backend, no edges).
[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
