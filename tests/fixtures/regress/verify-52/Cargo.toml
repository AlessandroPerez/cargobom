# Shapes of source met on the fifth batch of unseen crates.io packages (tendermint, tough,
# near-crypto) and on the way: `async` blocks a function builds and awaits; an `async` method
# awaited where it is called; a variable bound to an awaited call; modules and calls a macro
# defined in another file writes; a derive named on a later line of its attribute. Each case is
# commented where it is.
[package]
name = "verify-52"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["pm"]

[dependencies]
pm = { path = "pm" }
sha2 = "0.10"
