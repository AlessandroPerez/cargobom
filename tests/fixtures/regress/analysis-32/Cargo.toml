[package]
name = "probe32"
version = "0.1.0"
edition = "2024"

[dependencies]
p256 = { version = "=0.13.2", features = ["ecdh", "ecdsa", "sha256"] }
p384 = { version = "=0.13.1", features = ["ecdh", "ecdsa", "sha384"] }
sha3 = "=0.10.9"
sha2 = "=0.10.9"
rand = { version = "=0.8.5", features = ["small_rng"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
ml-kem = { version = "=0.2.3", features = ["deterministic"] }
hkdf = "0.12"

[workspace]
